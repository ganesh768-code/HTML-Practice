<html>
<head>
  <title>Table-Headings-Practice</title>
</head>
<body>
    <table>
      <tr>
        <!-- Empty top-left cell -->
        <th></th>
        <th scope="col">Monday</th>
        <th scope="col">Tuesday</th>
        <th scope="col">Wednesday</th>
      </tr>

      <tr>
        <th scope="row">Math</th>
        <td>Algebra</td>
        <td>Geometry</td>
        <td></td> <!-- Empty cell -->
      </tr>

      <tr>
        <th scope="row">Science</th>
        <td>Physics</td>
        <td></td> <!-- Empty cell -->
        <td>Chemistry</td>
      </tr>

    </table>
</body>
</html>
