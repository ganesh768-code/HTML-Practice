<html>
<head>
  <title>Table-Rowspan-Practice</title>
</head>
<body>
    <h2>TV Schedule</h2>

    <table>
      <tr>
        <th>Time</th>
        <th>Channel 1</th>
        <th>Channel 2</th>
      </tr>

      <tr>
        <th>6:00 – 7:00</th>
        <td rowspan="2">Movie</td>
        <td>News</td>
      </tr>

      <tr>
        <th>7:00 – 8:00</th>
        <!-- No <td> for Channel 1 here -->
        <td>Drama</td>
      </tr>

      <tr>
        <th>8:00 – 9:00</th>
        <td>Sports</td>
        <td>Music</td>
      </tr>

    </table>
</body>
</html>
