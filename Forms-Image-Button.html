<!DOCTYPE html>
<html>
<head>
    <title>Forms-Image-Button-Demo</title>
</head>
<body>

    <h2>Contact Form</h2>

    <form method="post">
        <label>Name:</label><br>
        <input type="text" name="name"><br><br>

        <label>Email:</label><br>
        <input type="text" name="email"><br><br>

        <!-- Image Submit Button -->
        <input type="image" src="Images/submit.png" alt="Submit" width="100" height="60">
    </form>

</body>
</html>
