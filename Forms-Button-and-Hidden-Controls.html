<html>
<head>
    <title>Forms-Button-and-Hidden-Controls-Demo</title>
</head>
<body>

    <h2>Feedback Form</h2>

    <form method="post">

        <!-- Hidden Input -->
        <input type="hidden" name="page" value="home">

        <!-- Regular Input -->
        <p>Name:</p>
        <input type="text" name="username"><br><br>

        <!-- Flexible Button with Text & Image -->
        <button type="submit">
            <img src="Images/SubmitFeedback.png" alt="Icon" width="20" height="20"> Submit Feedback
        </button>

    </form>
</body>
</html>
