<html>
<head>
  <title>Long-Tables-Practice</title>
</head>
<body>
    <table>
      <thead>
        <tr>
          <th>Day</th>
          <th>Subject</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>Monday</td>
          <td>Math</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Total</td>
          <td>2 Classes</td>
        </tr>
      </tfoot>
    </table>
</body>
</html>
