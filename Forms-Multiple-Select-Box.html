<html>
<head>
    <title>Forms-Multiple-Select-Box-Demo</title>
</head>
<body>
    <h2>Student Skills Form</h2>

    <form>
        <p>Select your skills:</p>

        <select name="skills" size="2" multiple="multiple">
            <option value="html">HTML</option>
            <option value="css">CSS</option>
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
        </select>

        <p><small>
            Hold <b>Ctrl</b> (Windows) or <b>Command</b> (Mac) to select multiple options
        </small></p>

        <br>
        <input type="submit" value="Submit">
    </form>

</body>
</html>
