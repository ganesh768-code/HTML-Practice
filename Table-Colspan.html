<html>
<head>
  <title>Table-Colspan-Practice</title>
</head>
<body>
    <table>
      <tr>
        <!-- Merged heading -->
        <th colspan="5">Weekly Class Schedule</th>
      </tr>

      <tr>
        <th>Day</th>
        <th>9–10</th>
        <th>10–11</th>
        <th>11–12</th>
        <th>12–1</th>
      </tr>

      <tr>
        <th>Monday</th>
        <td>Math</td>
        <td colspan="2">Geography</td>
        <!-- No extra <td> here -->
        <td>English</td>
      </tr>

      <tr>
        <th>Tuesday</th>
        <td>Science</td>
        <td>Math</td>
        <td colspan="2">Computer</td>
        <!-- No extra <td> here -->
      </tr>

    </table>
</body>
</html>
