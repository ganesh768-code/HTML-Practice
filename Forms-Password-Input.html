<html>
<head>
    <title>Forms-Password-Input-Demo</title>
</head>
<body>
    <h2>Login Form</h2>

    <form>
        <!-- Username -->
        <label>Username:</label><br>
        <input type="text" name="username"><br><br>

        <!-- Password -->
        <label>Password:</label><br>
        <input type="password" name="password" maxlength="8"><br><br>

        <input type="submit" value="Login">
    </form>

</body>
</html>
